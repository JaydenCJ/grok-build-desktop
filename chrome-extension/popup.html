<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/popup.css" />
    <title>Grok Build Agent</title>
  </head>
  <body>
    <main class="panel">
      <!-- Header: brand + agent state + new/clear -->
      <header class="panel-head">
        <div class="brand">
          <span class="brand-mark">G</span>
          <span class="brand-name">Grok Build</span>
        </div>
        <span id="bridge-status" class="bridge-pill">bridge off</span>
      </header>

      <!-- Controlled / watched tab list -->
      <section id="tab-list" class="tabs"></section>

      <!-- High-risk banner (shown only in run-without-confirm mode) -->
      <div id="risk-banner" class="risk-banner" hidden>
        <strong>High risk:</strong> Grok will act on this page without asking
        each time — it can click, type, and navigate. Use only on pages you trust.
      </div>

      <!-- Command composer (Claude-in-Chrome style) -->
      <section class="composer">
        <textarea
          id="command"
          class="command-input"
          rows="2"
          placeholder="Tell Grok what to do on this tab…  ( / for actions )"
        ></textarea>
        <div class="composer-row">
          <button id="exec-mode" class="exec-mode" type="button" data-mode="ask">
            <span class="exec-glyph">»</span>
            <span id="exec-label">Ask before acting</span>
          </button>
          <div class="composer-actions">
            <button id="control" class="ghost-btn" type="button" title="Control current tab">＋ Control tab</button>
            <button id="send" class="send-btn" type="button" title="Send (⏎)">↑</button>
          </div>
        </div>
      </section>

      <!-- Safety toggles -->
      <section class="safety">
        <label><input id="focus-guard" type="checkbox" /> Respect my typing focus</label>
        <label><input id="visible-motion" type="checkbox" /> Show agent cursor motion</label>
        <label><input id="controlled-only" type="checkbox" /> Act only on controlled tabs</label>
      </section>

      <footer class="panel-foot">
        <button id="track" class="text-btn" type="button">Watch tab</button>
        <button id="snapshot-all" class="text-btn" type="button">Scan all</button>
        <button id="refresh" class="text-btn" type="button">Refresh</button>
      </footer>
    </main>
    <script src="src/popup.js"></script>
  </body>
</html>
