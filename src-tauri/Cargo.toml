[package]
name = "grok-desktop"
version = "0.1.0"
description = "Grok Build Desktop: a native desktop app for xAI's Grok CLI, built with Tauri 2 and React"
authors = ["JaydenCJ"]
license-file = "../LICENSE"
repository = "https://github.com/JaydenCJ/grok-build-desktop"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "grok_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "macros", "chrono"] }
uuid = { version = "1", features = ["v7", "serde"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
ignore = "0.4"

# nix is Unix-only (signals, process groups); skipped on Windows where we use
# taskkill /T for process-tree termination instead. See src/runs/process.rs.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process"] }

