name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Shared apt list for the Tauri (wry/webkit) build on ubuntu runners.
  TAURI_APT_DEPS: >-
    libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev
    librsvg2-dev build-essential pkg-config libssl-dev

jobs:
  node:
    name: node · build + unit + smoke + check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # `npm run check` includes `cargo check` on src-tauri, which needs the
      # Rust toolchain plus the webkit/gtk system libraries on Linux.
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.TAURI_APT_DEPS }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-check-

      - name: Install npm dependencies
        run: npm ci

      - name: Build (tsc + vite)
        run: npm run build

      - name: Unit tests (vitest)
        run: npm run test:unit

      - name: Smoke test
        run: npm test

      - name: Check (tsc --noEmit + cargo check)
        run: npm run check

  rust:
    name: rust · cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.TAURI_APT_DEPS }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: cargo test
        working-directory: src-tauri
        run: cargo test
